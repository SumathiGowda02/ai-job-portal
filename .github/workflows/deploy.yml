name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build & test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: backend
        run: mvn -B clean verify

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Requires these repo secrets to be set under Settings -> Secrets and variables -> Actions:
      #   EC2_HOST         public IP or DNS of the EC2 instance
      #   EC2_USER         SSH user (e.g. ubuntu)
      #   EC2_SSH_KEY      private key matching the instance's key pair
      #   ENV_FILE         full contents of the production .env (JWT_SECRET, AWS_*, AI_API_KEY, etc.)
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ai-job-portal || git clone https://github.com/${{ github.repository }} ~/ai-job-portal && cd ~/ai-job-portal
            git fetch origin main
            git reset --hard origin/main
            cat > .env << 'ENVEOF'
            ${{ secrets.ENV_FILE }}
            ENVEOF
            docker compose pull
            docker compose up -d --build
            docker image prune -f
