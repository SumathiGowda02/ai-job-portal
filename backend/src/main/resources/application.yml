server:
  port: 8080

spring:
  application:
    name: ai-job-portal
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:jobportal}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:jobportal}
    password: ${DB_PASSWORD:jobportal}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 600000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:replace-this-with-a-long-random-base64-secret-min-256-bits}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket: ${AWS_S3_BUCKET:ai-job-portal-resumes}
  access-key: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}

storage:
  # local  -> saves resumes to disk under storage.local-dir (default for local/dev runs, no AWS needed)
  # s3     -> saves resumes to the S3 bucket configured above (use this in production/EC2)
  provider: ${STORAGE_PROVIDER:local}
  local-dir: ${STORAGE_LOCAL_DIR:./uploaded-resumes}

ai:
  provider-url: ${AI_PROVIDER_URL:http://localhost:11434/api/chat}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:llama3.2:3b}
  

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.jobportal: INFO
